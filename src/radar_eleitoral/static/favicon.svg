<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Vibrant Emerald & Mint Gradients -->
    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6ee7b7" />
      <stop offset="50%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>

    <linearGradient id="sweepGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.1" />
      <stop offset="60%" stop-color="#34d399" stop-opacity="0.45" />
      <stop offset="100%" stop-color="#a7f3d0" stop-opacity="0.85" />
    </linearGradient>

    <radialGradient id="centerGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="35%" stop-color="#a7f3d0" />
      <stop offset="70%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#059669" />
    </radialGradient>
  </defs>

  <!-- Radar Sweep Sector (Upper Right) with vibrant gradient -->
  <path d="M 256 256 L 476 256 A 220 220 0 0 0 256 36 Z" fill="url(#sweepGrad)" />

  <!-- Radar Concentric Rings (Bold, Thick, High Contrast) -->
  <!-- Outer Ring (r=220, stroke=36) -->
  <circle cx="256" cy="256" r="220" fill="none" stroke="url(#ringGrad)" stroke-width="36" />

  <!-- Inner Ring (r=130, stroke=32) -->
  <circle cx="256" cy="256" r="130" fill="none" stroke="#10b981" stroke-width="32" stroke-opacity="0.9" />

  <!-- Radar Crosshairs (Thick 24px lines) -->
  <line x1="256" y1="36" x2="256" y2="476" stroke="#34d399" stroke-width="24" stroke-opacity="0.75" stroke-linecap="round" />
  <line x1="36" y1="256" x2="476" y2="256" stroke="#34d399" stroke-width="24" stroke-opacity="0.75" stroke-linecap="round" />

  <!-- Target Detection Ping / Blip (Upper Right Sweep) -->
  <circle cx="390" cy="122" r="38" fill="none" stroke="#a7f3d0" stroke-width="16" opacity="0.9" />
  <circle cx="390" cy="122" r="22" fill="#ffffff" />

  <!-- Secondary Blip -->
  <circle cx="170" cy="342" r="18" fill="#34d399" />

  <!-- Center Beacon Core (Large, Ultra-Bright Glowing Core) -->
  <circle cx="256" cy="256" r="62" fill="url(#centerGlow)" stroke="#040f0c" stroke-width="12" />
  <circle cx="256" cy="256" r="24" fill="#ffffff" />
</svg>
